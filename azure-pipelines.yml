trigger:
- main

stages:

- stage: ValidateAndPlan
  displayName: 'Validate and Plan'

  jobs:

  - job: TerraformPlan
    displayName: 'Terraform Plan'

    pool:
      vmImage: ubuntu-latest

    steps:

    - script: |
        mkdir -p tools
        cd tools

        wget https://releases.hashicorp.com/terraform/1.13.2/terraform_1.13.2_linux_amd64.zip

        unzip -o terraform_1.13.2_linux_amd64.zip

        chmod +x terraform

        ./terraform version
      displayName: 'Download and Verify Terraform'

    - script: |
        cd tools

        ./terraform fmt -check -recursive ../terraform
      displayName: 'Terraform Format Check'

    - script: |
        cd terraform

        ../tools/terraform init -backend=false

        ../tools/terraform validate
      displayName: 'Terraform Validate'

    - task: AzureCLI@2
      displayName: 'Verify Azure Connection'
      inputs:
        azureSubscription: 'sc-azure-platform-lab'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az account show

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: 'sc-azure-platform-lab'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd terraform

          ../tools/terraform init

    - script: |
        if [ -z "$TF_VAR_ssh_public_key" ]; then
          echo "Variable NOT found"
          exit 1
        else
          echo "Variable found"
          echo "Length: ${#TF_VAR_ssh_public_key}"
        fi
      displayName: 'Verify Terraform Variable'
      env:
        TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      env:
        TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

      inputs:
        azureSubscription: 'sc-azure-platform-lab'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd terraform

          ../tools/terraform plan -input=false

- stage: Apply
  displayName: 'Terraform Apply'

  dependsOn: ValidateAndPlan

  jobs:

  - deployment: TerraformApply
    displayName: 'Apply Terraform'

    environment: terraform-lab

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - script: |
              mkdir -p tools
              cd tools

              wget https://releases.hashicorp.com/terraform/1.13.2/terraform_1.13.2_linux_amd64.zip

              unzip -o terraform_1.13.2_linux_amd64.zip

              chmod +x terraform
            displayName: 'Download Terraform'

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            env:
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

            inputs:
              azureSubscription: 'sc-azure-platform-lab'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd terraform

                ../tools/terraform init

                ../tools/terraform apply -auto-approve -input=false
- script: |
    sudo apt-get update

    sudo apt-get install -y ansible

    ansible --version
  displayName: 'Install and Verify Ansible'